auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
limits_config:
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  max_query_series: 1000
  deletion_mode: disabled
  retention_period: 0s
  retention_stream:
    - selector: '{service_name="shirokuma-local",component="sre-telemetry-severity"}'
      priority: 1
      period: 24h
analytics:
  reporting_enabled: false
