apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-local
  labels:
    app.kubernetes.io/name: trino-local
    app.kubernetes.io/part-of: shirokuma
    shirokuma.dev/scope: local-experiment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trino-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trino-local
        app.kubernetes.io/part-of: shirokuma
        shirokuma.dev/scope: local-experiment
        shirokuma.dev/object-storage-client: "true"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trino
          image: shirokuma.local/trino
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 16Gi
          env:
            - name: SALES_POLARIS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: polaris-trino-credentials
                  key: client_id
            - name: SALES_POLARIS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: polaris-trino-credentials
                  key: client_secret
            - name: FINANCE_POLARIS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: polaris-finance-trino-credentials
                  key: client_id
            - name: FINANCE_POLARIS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: polaris-finance-trino-credentials
                  key: client_secret
            - name: SALES_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-sales-credentials
                  key: S3_REGION
            - name: SALES_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-sales-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: SALES_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-sales-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: FINANCE_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-finance-credentials
                  key: S3_REGION
            - name: FINANCE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-finance-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: FINANCE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-finance-credentials
                  key: AWS_SECRET_ACCESS_KEY
          startupProbe:
            httpGet:
              path: /v1/info
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /v1/info
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/info
              port: http
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/trino
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/trino
      volumes:
        - name: config
          configMap:
            name: trino-local-config
            items:
              - key: config.properties
                path: config.properties
              - key: node.properties
                path: node.properties
              - key: jvm.config
                path: jvm.config
              - key: log.properties
                path: log.properties
              - key: iceberg.properties
                path: catalog/iceberg.properties
              - key: finance.properties
                path: catalog/finance.properties
              - key: tpch.properties
                path: catalog/tpch.properties
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: data
          emptyDir:
            sizeLimit: 2Gi
