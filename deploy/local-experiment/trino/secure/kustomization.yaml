apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shirokuma-dev
images:
  - name: shirokuma.local/trino
    newName: docker.io/trinodb/trino
    digest: sha256:aa18e61b2e7776ab8641ba8baaa8687d0430894e88c639e61010cc46a994ab36
resources:
  - ../deployment.yaml
  - ../service.yaml
  - ../networkpolicy.yaml
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configMapGenerator:
  - name: trino-local-config
    files:
      - config.properties
      - ../node.properties
      - ../jvm.config
      - ../log.properties
      - ../iceberg.properties
      - ../finance.properties
      - ../tpch.properties
      - password-authenticator.properties
      - access-control.properties
      - opa-access-control.properties
      - rules.json
  - name: trino-local-opa
    files:
      - opa/guard.rego
      - opa/api.rego
patches:
  - path: deployment.yaml
  - target:
      kind: Service
      name: trino-local
    patch: |-
      - op: replace
        path: /spec/ports/0/targetPort
        value: https
  - target:
      kind: NetworkPolicy
      name: trino-local
    patch: |-
      - op: replace
        path: /spec/ingress
        value: []
