connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris.shirokuma-dev.svc.cluster.local:8181/api/catalog
iceberg.rest-catalog.warehouse=shirokuma_l1
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_CLIENT_ID}:${ENV:POLARIS_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.oauth2.server-uri=http://polaris.shirokuma-dev.svc.cluster.local:8181/api/catalog/v1/oauth/tokens
iceberg.rest-catalog.oauth2.token-exchange-enabled=false
iceberg.rest-catalog.http-headers=Polaris-Realm:${ENV:POLARIS_REALM}
iceberg.rest-catalog.vended-credentials-enabled=false
fs.s3.enabled=true
s3.endpoint=http://seaweedfs-s3.shirokuma-storage.svc.cluster.local:8333
s3.region=${ENV:AWS_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
