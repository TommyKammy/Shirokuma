apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trino-local
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trino-local
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: trino-local
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: polaris
              app.kubernetes.io/component: catalog-server
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: polaris-finance
              app.kubernetes.io/component: catalog-server
      ports:
        - port: 8181
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shirokuma-storage
          podSelector:
            matchLabels:
              app.kubernetes.io/name: seaweedfs
              app.kubernetes.io/component: object-storage
      ports:
        - port: 8333
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
