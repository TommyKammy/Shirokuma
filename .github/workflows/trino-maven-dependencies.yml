        with:
          version: v0.72.0
          scan-type: sbom
          scan-ref: .trino-candidate/trino-maven-dependencies-483.cdx.json
          format: json
          output: .trino-candidate/trivy-vulnerability.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          vuln-type: library
