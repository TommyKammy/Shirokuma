              --checkout "${offline_source}"
            python3 scripts/package_trino_bun_dependencies.py verify-cache \
              --descriptor "${candidate}/bun-dependency-manifest.json" \
              --cache "${offline_bun_cache}"
            output="${offline_source}/core/trino-server/target/trino-server-483.tar.gz"
            test -s "${output}"
            python3 scripts/verify_trino_dependency_publisher.py \
              verify-server-distribution --archive "${output}"
            sha256sum "${output}" | cut -d' ' -f1 \
              > "${candidate}/offline-output-${suffix}.sha256"
            stat --format='%s' "${output}" > "${candidate}/offline-output-${suffix}.size"
          done
          cmp \
            "${candidate}/offline-output-a.sha256" \
            "${candidate}/offline-output-b.sha256"
          cmp \
            "${candidate}/offline-output-a.size" \
            "${candidate}/offline-output-b.size"
