      - name: Retain the raw Bun High or Critical findings
        if: steps.lifecycle.outputs.active == 'true'
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
