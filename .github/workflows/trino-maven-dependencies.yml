name: Trino 483 build dependency snapshot

on:
  pull_request:
    paths:
      - .github/workflows/trino-maven-dependencies.yml
      - bootstrap/trino/v483/admission.json
      - bootstrap/trino/v483/maven-policy/.mvn/jvm.config
      - bootstrap/trino/v483/patches/0001-shirokuma-web-ui-security.patch
      - bootstrap/trino/v483/patches/0002-shirokuma-iceberg-only-maven-closure.patch
      - bootstrap/trino/v483/patches/0003-shirokuma-maven-build-plugin-closure.patch
      - bootstrap/trino/v483/settings.xml
      - bootstrap/trino/v483/trusted-build-contract.json
      - bootstrap/trino/v483/vex/react-router-7.18.1-ghsa-qwww-vcr4-c8h2.openvex.json
      - docs/design/07_ADR/ADR-0024_Apply_bounded_Trino_483_Web_UI_dependency_overlay_and_OpenVEX.md
      - docs/design/07_ADR/ADR-0026_Authorize_bounded_Parquet_Jackson_1_17_1_source_remediation.md
      - docs/design/07_ADR/ADR-0027_Authorize_bounded_Trino_483_Iceberg_only_Maven_closure.md
      - docs/design/07_ADR/ADR-0028_Keep_Trino_483_publisher_blocked_for_refreshed_Maven_findings.md
      - docs/design/07_ADR/ADR-0029_Authorize_exact_Trino_483_Maven_build_plugin_remediation.md
      - docs/design/evidence/trino/run-31072144404-maven-feasibility-artifact-receipt.json
      - docs/design/evidence/trino/run-31072144404-maven-feasibility-validation.json
      - scripts/package_trino_bun_dependencies.py
      - scripts/package_trino_maven_dependencies.py
      - scripts/prepare_trino_bun_input.py
      - scripts/remediate_parquet_jackson.py
      - scripts/verify_trino_dependency_publisher.py
      - scripts/verify_trino_maven_feasibility.py
      - tests/test_parquet_jackson_remediation.py
      - tests/test_trino_bun_dependencies.py
      - tests/test_trino_dependency_publisher.py
      - tests/test_trino_maven_feasibility.py
      - Makefile
  push:
    branches:
      - main
    paths:
      - .github/workflows/trino-maven-dependencies.yml
      - bootstrap/trino/v483/admission.json
      - bootstrap/trino/v483/maven-policy/.mvn/jvm.config
      - bootstrap/trino/v483/patches/0001-shirokuma-web-ui-security.patch
      - bootstrap/trino/v483/patches/0002-shirokuma-iceberg-only-maven-closure.patch
      - bootstrap/trino/v483/patches/0003-shirokuma-maven-build-plugin-closure.patch
      - bootstrap/trino/v483/settings.xml
      - bootstrap/trino/v483/trusted-build-contract.json
      - bootstrap/trino/v483/vex/react-router-7.18.1-ghsa-qwww-vcr4-c8h2.openvex.json
      - docs/design/07_ADR/ADR-0024_Apply_bounded_Trino_483_Web_UI_dependency_overlay_and_OpenVEX.md
      - docs/design/07_ADR/ADR-0026_Authorize_bounded_Parquet_Jackson_1_17_1_source_remediation.md
      - docs/design/07_ADR/ADR-0027_Authorize_bounded_Trino_483_Iceberg_only_Maven_closure.md
      - docs/design/07_ADR/ADR-0028_Keep_Trino_483_publisher_blocked_for_refreshed_Maven_findings.md
      - docs/design/07_ADR/ADR-0029_Authorize_exact_Trino_483_Maven_build_plugin_remediation.md
      - docs/design/evidence/trino/run-31072144404-maven-feasibility-artifact-receipt.json
      - docs/design/evidence/trino/run-31072144404-maven-feasibility-validation.json
      - scripts/package_trino_bun_dependencies.py
      - scripts/package_trino_maven_dependencies.py
      - scripts/prepare_trino_bun_input.py
      - scripts/remediate_parquet_jackson.py
      - scripts/verify_trino_dependency_publisher.py
      - scripts/verify_trino_maven_feasibility.py
      - tests/test_parquet_jackson_remediation.py
      - tests/test_trino_bun_dependencies.py
      - tests/test_trino_dependency_publisher.py
      - tests/test_trino_maven_feasibility.py
      - Makefile

permissions:
  contents: read

concurrency:
  group: trino-483-build-dependencies-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GITHUB_EVENT_BEFORE: ${{ github.event.before }}
  SOURCE_REPOSITORY: https://github.com/trinodb/trino
  SOURCE_TAG: "483"
  SOURCE_TAG_OBJECT: 32d4f28e8311ea6f67edca209df59a0493d869fa
  SOURCE_COMMIT: 50b0b50b75abd47f830b7805ee1b51716eb4065e
  SOURCE_TREE: 3b5414292a614b12393bb4605ea2d4c588a5b8ee
  PARQUET_SOURCE_REPOSITORY: https://github.com/apache/parquet-java
  PARQUET_RELEASE_TAG: apache-parquet-1.17.1
  PARQUET_RELEASE_TAG_OBJECT: 1f54ba44afb285fecbaf54bde5c0afa259327fc4
  PARQUET_RC_TAG: apache-parquet-1.17.1-rc0
  PARQUET_RC_TAG_OBJECT: 172d200a7eb81161345bdccaf628af34178fc479
  PARQUET_SOURCE_COMMIT: 78a8d3230eb4769db93de5f2f2e18363c04cae81
  PARQUET_SOURCE_TREE: 28b877df95a7a661361b8776f6ebe21d73d8da6d
  PARQUET_OUTPUT_TIMESTAMP: "2026-05-08T01:45:35Z"
  BUILDER_IMAGE: docker.io/library/maven@sha256:7e461cec477077c1d9e50b13df8aef9018764410f4c4cd7c34803f10c4c99e4c
  BUILDER_ARM64_MANIFEST: sha256:5476bfca9d0a6485b7161f6863123f7e6822336de4177273b47b5ec38ffd573a
  BUN_URL: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-aarch64.zip
  BUN_ARCHIVE_SHA256: a27ffb63a8310375836e0d6f668ae17fa8d8d18b88c37c821c65331973a19a3b
  BUN_ARCHIVE_SIZE: "35700603"
  BUN_CACHE_DIRECTORY: /bun-cache
  BUN_REGISTRY: https://registry.npmjs.org/
  ARTIFACT_REPOSITORY: ghcr.io/tommykammy/shirokuma-trino-maven-dependencies
  ARTIFACT_TYPE: application/vnd.shirokuma.trino.build-dependencies.v3
  DESCRIPTOR_MEDIA_TYPE: application/vnd.shirokuma.maven-dependency-manifest.v2+json
  ARCHIVE_MEDIA_TYPE: application/vnd.shirokuma.maven-repository.v1.tar+gzip
  BUN_DESCRIPTOR_MEDIA_TYPE: application/vnd.shirokuma.bun-dependency-manifest.v1+json
  BUN_ARCHIVE_MEDIA_TYPE: application/vnd.shirokuma.bun-cache.v1.tar+gzip
  ORAS_VERSION: 1.3.3
  ORAS_URL: https://github.com/oras-project/oras/releases/download/v1.3.3/oras_1.3.3_linux_arm64.tar.gz
  ORAS_ARCHIVE_SHA256: ac7156f93a21e903f7ad606c792f3560f17e0cd0e36365634701b1e7cc4e4eca
  COSIGN_VERSION: v3.1.1
  TRIVY_VERSION: v0.72.0

jobs:
  validate:
    if: >-
      github.repository == 'TommyKammy/Shirokuma' &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.sha == github.workflow_sha
        )
      )
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    permissions:
      contents: read
    outputs:
      active: ${{ steps.lifecycle.outputs.active }}
      candidate_artifact_name: ${{ steps.record.outputs.candidate_artifact_name }}
      archive_sha256: ${{ steps.record.outputs.archive_sha256 }}
      bun_archive_sha256: ${{ steps.record.outputs.bun_archive_sha256 }}
      bun_descriptor_sha256: ${{ steps.record.outputs.bun_descriptor_sha256 }}
      bun_sbom_sha256: ${{ steps.record.outputs.bun_sbom_sha256 }}
      bun_scan_raw_sha256: ${{ steps.record.outputs.bun_scan_raw_sha256 }}
      bun_scan_sha256: ${{ steps.record.outputs.bun_scan_sha256 }}
      bun_vex_sha256: ${{ steps.record.outputs.bun_vex_sha256 }}
      descriptor_sha256: ${{ steps.record.outputs.descriptor_sha256 }}
      offline_sha256: ${{ steps.record.outputs.offline_sha256 }}
      reconstruction_sha256: ${{ steps.record.outputs.reconstruction_sha256 }}
      sbom_sha256: ${{ steps.record.outputs.sbom_sha256 }}
      scan_sha256: ${{ steps.record.outputs.scan_sha256 }}
      toolchain_sha256: ${{ steps.record.outputs.toolchain_sha256 }}

    steps:
      - name: Check out the reviewed Trino dependency policy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Validate the publication-pending contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_parquet_jackson_remediation
          python3 -m unittest -v tests.test_trino_bun_dependencies
          python3 -m unittest -v tests.test_trino_dependency_publisher
          python3 scripts/verify_trino_dependency_publisher.py audit --root .

      - name: Check the Trino dependency publication lifecycle
        id: lifecycle
        shell: bash
        run: |
          set -euo pipefail
          publication_status="$(
            python3 scripts/verify_trino_dependency_publisher.py \
              publication-status --root .
          )"
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
            pull_request:*)
              echo "active=false" >> "${GITHUB_OUTPUT}"
              if [[ "${publication_status}" = "blocked" ]]; then
                echo "source_validation_active=false" >> "${GITHUB_OUTPUT}"
                echo "Pull requests perform static contract validation only while publication is blocked"
                exit 0
              fi
              test "${publication_status}" = "active"
              python3 scripts/verify_trino_dependency_publisher.py authorize --root .
              echo "source_validation_active=true" >> "${GITHUB_OUTPUT}"
              echo "Pull requests perform static and Web UI overlay build validation only"
              ;;
            push:refs/heads/main)
              test "${GITHUB_SHA}" = "${GITHUB_WORKFLOW_SHA}"
              echo "source_validation_active=false" >> "${GITHUB_OUTPUT}"
              if [[ "${publication_status}" = "blocked" ]]; then
                printf 'active=false\n' >> "${GITHUB_OUTPUT}"
                echo "Trino dependency publication is blocked pending new explicit owner authorization"
                exit 0
              fi
              test "${publication_status}" = "active"
              python3 scripts/verify_trino_dependency_publisher.py authorize --root .
              python3 scripts/verify_trino_dependency_publisher.py authorize-use \
                --root . --validation-point before_dependency_publication
              echo "active=true" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "unexpected event/ref for Trino dependency publisher" >&2
              exit 1
              ;;
          esac

      - name: Verify the native arm64 builder substrate
        if: steps.lifecycle.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_trino_dependency_publisher.py authorize --root .
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "ARM64"
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "aarch64"
          if test -d /proc/sys/fs/binfmt_misc; then
            test -z "$(find /proc/sys/fs/binfmt_misc -maxdepth 1 -type f -name 'qemu-*' -print -quit)"
          fi
          docker pull --platform linux/arm64 "${BUILDER_IMAGE}"
          test "$(docker image inspect "${BUILDER_IMAGE}" --format '{{.Architecture}}')" = "arm64"
          container_arch=$(
            docker run --rm --platform linux/arm64 "${BUILDER_IMAGE}" uname -m
          )
          test "${container_arch}" = "aarch64"
          docker run --rm --platform linux/arm64 \
            --env HOME=/tmp/maven-home \
            --env MAVEN_CONFIG=/tmp/maven-home/.m2 \
            --env MAVEN_OPTS=-Duser.home=/tmp/maven-home \
            --env JAVA_TOOL_OPTIONS= \
            --entrypoint /usr/share/maven/bin/mvn \
            "${BUILDER_IMAGE}" --version \
            > "${RUNNER_TEMP}/maven-version.txt"
          grep -F 'Apache Maven 3.9.16' "${RUNNER_TEMP}/maven-version.txt"
          grep -F 'Java version: 25' "${RUNNER_TEMP}/maven-version.txt"
          grep -F 'vendor: Eclipse Adoptium' "${RUNNER_TEMP}/maven-version.txt"
          grep -F 'OS name: "linux", version:' "${RUNNER_TEMP}/maven-version.txt"
          grep -F 'arch: "aarch64"' "${RUNNER_TEMP}/maven-version.txt"
          docker run --rm --platform linux/arm64 \
            --entrypoint /bin/cat \
            "${BUILDER_IMAGE}" /usr/share/maven/conf/settings.xml \
            > "${RUNNER_TEMP}/maven-global-settings.xml"
          python3 scripts/verify_trino_dependency_publisher.py audit-builder-settings \
            --settings "${RUNNER_TEMP}/maven-global-settings.xml"
          RUNNER_UNAME="$(uname -a)" CONTAINER_ARCH="${container_arch}" \
            python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          record = {
              "schema_version": 1,
              "result": "passed",
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "runner_uname": os.environ["RUNNER_UNAME"],
              "container_architecture": os.environ["CONTAINER_ARCH"],
              "native_execution": True,
              "qemu_binfmt_handlers": [],
              "builder_index": os.environ["BUILDER_IMAGE"],
              "builder_arm64_manifest": os.environ["BUILDER_ARM64_MANIFEST"],
              "maven_version_output": Path(
                  os.environ["RUNNER_TEMP"], "maven-version.txt"
              ).read_text(encoding="utf-8"),
              "global_settings_sha256": hashlib.sha256(
                  Path(
                      os.environ["RUNNER_TEMP"], "maven-global-settings.xml"
                  ).read_bytes()
              ).hexdigest(),
              "global_settings_effective_entries": [
                  "mirror:maven-default-http-blocker"
              ],
              "global_settings_policy": (
                  "empty-standard-containers-plus-exact-default-http-blocker"
              ),
          }
          Path(os.environ["RUNNER_TEMP"], "trino-toolchain.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Fetch and verify the exact provisionally authorized source
        if: >-
          steps.lifecycle.outputs.active == 'true' ||
          steps.lifecycle.outputs.source_validation_active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_trino_dependency_publisher.py authorize --root .
          source_dir="${RUNNER_TEMP}/trino-source"
          test ! -e "${source_dir}"
          git init "${source_dir}"
          git -C "${source_dir}" remote add origin "${SOURCE_REPOSITORY}"
          git -C "${source_dir}" fetch --depth=1 origin \
            "${SOURCE_COMMIT}" "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
          test "$(git -C "${source_dir}" rev-parse "refs/tags/${SOURCE_TAG}")" \
            = "${SOURCE_TAG_OBJECT}"
          test "$(git -C "${source_dir}" rev-parse "refs/tags/${SOURCE_TAG}^{}")" \
            = "${SOURCE_COMMIT}"
          git -C "${source_dir}" checkout --detach "${SOURCE_COMMIT}"
          test "$(git -C "${source_dir}" rev-parse 'HEAD^{tree}')" = "${SOURCE_TREE}"
          python3 scripts/verify_trino_dependency_publisher.py audit-source \
            --root . --checkout "${source_dir}"

      - name: Apply the bounded Web UI security overlay
        if: >-
          steps.lifecycle.outputs.active == 'true' ||
          steps.lifecycle.outputs.source_validation_active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_trino_dependency_publisher.py \
            apply-source-overlay \
            --root . --checkout "${RUNNER_TEMP}/trino-source"
          python3 scripts/verify_trino_maven_feasibility.py verify-candidate \
            --authorization-root . \
            --checkout "${RUNNER_TEMP}/trino-source"

      - name: Fetch and prepare the exact Parquet Jackson remediation sources
        if: >-
          steps.lifecycle.outputs.active == 'true' ||
          steps.lifecycle.outputs.source_validation_active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          suffixes=(a)
          if [[ "${{ steps.lifecycle.outputs.active }}" = "true" ]]; then
            suffixes+=(b)
          fi
          for suffix in "${suffixes[@]}"; do
            source_dir="${RUNNER_TEMP}/parquet-source-${suffix}"
            test ! -e "${source_dir}"
            git init "${source_dir}"
            git -C "${source_dir}" remote add origin \
              "${PARQUET_SOURCE_REPOSITORY}"
            git -C "${source_dir}" fetch --depth=1 origin \
              "${PARQUET_SOURCE_COMMIT}" \
              "refs/tags/${PARQUET_RELEASE_TAG}:refs/tags/${PARQUET_RELEASE_TAG}" \
              "refs/tags/${PARQUET_RC_TAG}:refs/tags/${PARQUET_RC_TAG}"
            test "$(
              git -C "${source_dir}" rev-parse \
                "refs/tags/${PARQUET_RELEASE_TAG}"
            )" = "${PARQUET_RELEASE_TAG_OBJECT}"
            test "$(
              git -C "${source_dir}" rev-parse \
                "refs/tags/${PARQUET_RC_TAG}"
            )" = "${PARQUET_RC_TAG_OBJECT}"
            git -C "${source_dir}" checkout --detach \
              "${PARQUET_SOURCE_COMMIT}"
            test "$(git -C "${source_dir}" rev-parse 'HEAD^{tree}')" \
              = "${PARQUET_SOURCE_TREE}"
            python3 scripts/remediate_parquet_jackson.py prepare-source \
              --checkout "${source_dir}"
          done

      - name: Validate the bounded Web UI overlay before merge
        if: steps.lifecycle.outputs.source_validation_active == 'true'
        env:
          CI: "true"
          BUN_CONFIG_REGISTRY: ${{ env.BUN_REGISTRY }}
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/trino-pr-bun-cache
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "ARM64"
          test "$(uname -m)" = "aarch64"
          source_dir="${RUNNER_TEMP}/trino-source"
          bun_archive="${RUNNER_TEMP}/bun-linux-aarch64-pr.zip"
          bun_dir="${RUNNER_TEMP}/trino-pr-bun"
          install -d -m 0700 "${bun_dir}" "${BUN_INSTALL_CACHE_DIR}"
          python3 scripts/prepare_trino_bun_input.py download \
            --url "${BUN_URL}" \
            --archive "${bun_archive}"
          python3 scripts/prepare_trino_bun_input.py verify \
            --archive "${bun_archive}"
          unzip -p "${bun_archive}" bun-linux-aarch64/bun \
            > "${bun_dir}/bun"
          chmod 0500 "${bun_dir}/bun"
          test "$("${bun_dir}/bun" --version)" = "1.3.14"
          export PATH="${bun_dir}:${PATH}"
          modern="${source_dir}/core/trino-web-ui/src/main/resources/webapp"
          legacy="${source_dir}/core/trino-web-ui/src/main/resources/webapp-legacy/src"
          bun install --frozen-lockfile --cwd "${modern}"
          bun run --cwd "${modern}" typecheck
          bun run --cwd "${modern}" build
          bun run --cwd "${legacy}" package:clean

      - name: Resolve and package the first closed Maven repository
        if: steps.lifecycle.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_trino_dependency_publisher.py authorize --root .
          source_dir="${RUNNER_TEMP}/trino-source"
          parquet_source="${RUNNER_TEMP}/parquet-source-a"
          parquet_repository="${RUNNER_TEMP}/parquet-maven-repository-a"
          repository="${RUNNER_TEMP}/maven-repository-a"
          bun_cache="${RUNNER_TEMP}/bun-cache-a"
          candidate="${GITHUB_WORKSPACE}/.trino-candidate"
          bun_archive="${RUNNER_TEMP}/bun-linux-aarch64-a.zip"
          install -d -m 0700 \
            "${parquet_repository}" "${repository}" "${bun_cache}" "${candidate}"
          docker run --rm \
            --platform linux/arm64 \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp/maven-home \
            --env MAVEN_CONFIG=/tmp/maven-home/.m2 \
            --env MAVEN_OPTS=-Duser.home=/tmp/maven-home \
            --env JAVA_TOOL_OPTIONS= \
            --env CI=true \
            --volume "${parquet_source}:/workspace" \
            --volume "${parquet_repository}:/m2" \
            --volume "${GITHUB_WORKSPACE}/bootstrap/trino/v483/maven-policy:/policy/.mvn:ro" \
            --volume "${GITHUB_WORKSPACE}/bootstrap/trino/v483/settings.xml:/policy/settings.xml:ro" \
            --workdir /policy \
            --entrypoint /usr/share/maven/bin/mvn \
            "${BUILDER_IMAGE}" \
            --batch-mode --show-version --errors --strict-checksums \
              --ignore-transitive-repositories \
              --settings /policy/settings.xml \
              -Dmaven.repo.local=/m2 \
              -Dproject.build.outputTimestamp="${PARQUET_OUTPUT_TIMESTAMP}" \
              --file /workspace/pom.xml \
              -pl :parquet-jackson -am \
              clean install -DskipTests \
            2>&1 | tee "${RUNNER_TEMP}/parquet-maven-transfer-a.log"
          python3 scripts/verify_trino_dependency_publisher.py audit-transfer-log \
            --log "${RUNNER_TEMP}/parquet-maven-transfer-a.log"
          python3 scripts/prepare_trino_bun_input.py download \
            --url "${BUN_URL}" \
            --archive "${bun_archive}"
          test "$(stat --format='%s' "${bun_archive}")" = "${BUN_ARCHIVE_SIZE}"
          echo "${BUN_ARCHIVE_SHA256}  ${bun_archive}" \
            | sha256sum --check --strict
          python3 scripts/prepare_trino_bun_input.py stage \
            --archive "${bun_archive}" \
            --repository "${repository}"
          python3 scripts/remediate_parquet_jackson.py stage-artifact \
            --checkout "${parquet_source}" \
            --build-repository "${parquet_repository}" \
            --target-repository "${repository}"
          docker run --rm \
            --platform linux/arm64 \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp/maven-home \
            --env MAVEN_CONFIG=/tmp/maven-home/.m2 \
            --env MAVEN_OPTS=-Duser.home=/tmp/maven-home \
            --env JAVA_TOOL_OPTIONS= \
            --env CI=true \
            --env BUN_INSTALL_CACHE_DIR="${BUN_CACHE_DIRECTORY}" \
            --env BUN_CONFIG_REGISTRY="${BUN_REGISTRY}" \
            --volume "${source_dir}:/workspace" \
            --volume "${repository}:/m2" \
            --volume "${bun_cache}:${BUN_CACHE_DIRECTORY}" \
            --volume "${GITHUB_WORKSPACE}/bootstrap/trino/v483/maven-policy:/policy/.mvn:ro" \
            --volume "${GITHUB_WORKSPACE}/bootstrap/trino/v483/settings.xml:/policy/settings.xml:ro" \
            --workdir /policy \
            --entrypoint /usr/share/maven/bin/mvn \
            "${BUILDER_IMAGE}" \
            --batch-mode --show-version --errors --strict-checksums \
              --ignore-transitive-repositories \
              --settings /policy/settings.xml \
              -Dmaven.repo.local=/m2 \
              -Dproject.build.outputTimestamp=2026-07-18T00:36:39Z \
              --file /workspace/pom.xml \
              -pl ':trino-server,:trino-server-core,:trino-server-main,:trino-hdfs,:trino-iceberg' \
              -am clean install -DskipTests \
              -Dmaven.source.skip=true -Dair.check.skip-all \
            2>&1 | tee "${candidate}/maven-transfer-a.log"
          python3 scripts/verify_trino_dependency_publisher.py audit-transfer-log \
            --log "${candidate}/maven-transfer-a.log"
          python3 scripts/verify_trino_maven_feasibility.py verify-candidate \
            --checkout "${source_dir}"
          python3 scripts/verify_trino_maven_feasibility.py prune-vulnerable-inputs \
            --repository "${repository}" --root .
          python3 scripts/remediate_parquet_jackson.py seal-artifact \
            --build-repository "${parquet_repository}" \
            --target-repository "${repository}"
          python3 scripts/package_trino_maven_dependencies.py \
            prune-reactor-outputs --repository "${repository}"
          python3 scripts/package_trino_maven_dependencies.py create \
            --repository "${repository}" \
            --descriptor "${candidate}/maven-dependency-manifest.json" \
            --archive "${candidate}/trino-maven-dependencies-483.tar.gz"
          python3 scripts/package_trino_bun_dependencies.py create \
            --cache "${bun_cache}" \
            --descriptor "${candidate}/bun-dependency-manifest.json" \
            --archive "${candidate}/trino-bun-dependencies-483.tar.gz"
          python3 scripts/verify_trino_dependency_publisher.py \
