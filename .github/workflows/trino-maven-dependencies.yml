          record = {
              "schema_version": 1,
              "result": "passed",
              "platform": "linux/arm64",
              "fresh_source_checkouts": 2,
              "fresh_snapshot_extractions": 2,
              "fresh_bun_cache_extractions": 2,
              "network": "none",
              "bun_cache_directory": "/bun-cache",
