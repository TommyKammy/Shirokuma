name: Trino 483 Maven security remediation feasibility

on:
  pull_request:
    paths:
      - .github/workflows/trino-maven-security-remediation-feasibility.yml
      - bootstrap/trino/v483/**
      - scripts/package_trino_maven_dependencies.py
      - scripts/prepare_trino_bun_input.py
      - scripts/remediate_parquet_jackson.py
      - scripts/run_trino_maven_security_feasibility.sh
      - scripts/verify_trino_dependency_publisher.py
      - scripts/verify_trino_maven_feasibility.py
      - scripts/verify_trino_maven_security_feasibility.py
      - tests/test_trino_maven_security_feasibility.py
      - docs/design/04_Development/049_Supply_Chain_Security.md
      - docs/design/07_ADR/ADR-0032_Prove_Trino_483_Maven_security_remediation_feasibility.md
      - docs/design/10_Research/106_ARM64_Container_Image_Compatibility.md
      - docs/design/context-manifest.json
      - Makefile

concurrency:
  group: trino-483-maven-security-feasibility-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: https://github.com/trinodb/trino
  SOURCE_TAG: "483"
  SOURCE_TAG_OBJECT: 32d4f28e8311ea6f67edca209df59a0493d869fa
  SOURCE_COMMIT: 50b0b50b75abd47f830b7805ee1b51716eb4065e
  SOURCE_TREE: 3b5414292a614b12393bb4605ea2d4c588a5b8ee
  PARQUET_SOURCE_REPOSITORY: https://github.com/apache/parquet-java
  PARQUET_RELEASE_TAG: apache-parquet-1.17.1
  PARQUET_RELEASE_TAG_OBJECT: 1f54ba44afb285fecbaf54bde5c0afa259327fc4
  PARQUET_RC_TAG: apache-parquet-1.17.1-rc0
  PARQUET_RC_TAG_OBJECT: 172d200a7eb81161345bdccaf628af34178fc479
  PARQUET_SOURCE_COMMIT: 78a8d3230eb4769db93de5f2f2e18363c04cae81
  PARQUET_SOURCE_TREE: 28b877df95a7a661361b8776f6ebe21d73d8da6d
  PARQUET_OUTPUT_TIMESTAMP: "2026-05-08T01:45:35Z"
  DOCKER_JAVA_SOURCE_REPOSITORY: https://github.com/docker-java/docker-java
  DOCKER_JAVA_SOURCE_TAG: 3.7.1
  DOCKER_JAVA_SOURCE_COMMIT: 7b7fabd4567573e4957e549365dc0df8c2e54ab9
  DOCKER_JAVA_SOURCE_TREE: f6119a3ff6da4b1df34a1054000b849c70f4aae6
  DOCKER_JAVA_BUILDER_IMAGE: docker.io/library/maven@sha256:5ad4be2ba5946d2513786e6e5374659a28e39ad5f3dfbc8a9109e1d3a1fde655
  TRINO_BUILDER_IMAGE: docker.io/library/maven@sha256:7e461cec477077c1d9e50b13df8aef9018764410f4c4cd7c34803f10c4c99e4c
  BUN_URL: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-aarch64.zip
  BUN_ARCHIVE_SHA256: a27ffb63a8310375836e0d6f668ae17fa8d8d18b88c37c821c65331973a19a3b
  BUN_ARCHIVE_SIZE: "35700603"
  BUN_CACHE_DIRECTORY: /bun-cache
  BUN_REGISTRY: https://registry.npmjs.org/

jobs:
  validate:
    if: github.repository == 'TommyKammy/Shirokuma'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    permissions:
      contents: read

    steps:
      - name: Check out the reviewed feasibility policy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Audit the PR-only fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_trino_maven_security_feasibility
          python3 scripts/verify_trino_maven_security_feasibility.py \
            audit-workflow --root .
          test "$(python3 scripts/verify_trino_dependency_publisher.py publication-status --root .)" = blocked

      - name: Verify native arm64 builders
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          test "${RUNNER_ARCH}" = ARM64
          test "$(uname -m)" = aarch64
          if test -d /proc/sys/fs/binfmt_misc; then
            test -z "$(find /proc/sys/fs/binfmt_misc -maxdepth 1 -type f -name 'qemu-*' -print -quit)"
          fi
          docker pull --platform linux/arm64 "${DOCKER_JAVA_BUILDER_IMAGE}"
          docker pull --platform linux/arm64 "${TRINO_BUILDER_IMAGE}"
          test "$(docker image inspect "${DOCKER_JAVA_BUILDER_IMAGE}" --format '{{.Architecture}}')" = arm64
          test "$(docker image inspect "${TRINO_BUILDER_IMAGE}" --format '{{.Architecture}}')" = arm64
          docker run --rm --platform linux/arm64 \
            --entrypoint /usr/share/maven/bin/mvn \
            "${DOCKER_JAVA_BUILDER_IMAGE}" --version \
            | tee "${RUNNER_TEMP}/docker-java-builder-version.txt"
          grep -F 'Apache Maven 3.9.12' "${RUNNER_TEMP}/docker-java-builder-version.txt"
          grep -F 'Java version: 8' "${RUNNER_TEMP}/docker-java-builder-version.txt"

      - name: Reconstruct and build the candidate twice
        shell: bash
        run: bash scripts/run_trino_maven_security_feasibility.sh

      - name: Generate the fresh complete Maven JAR inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: rootfs
          scan-ref: ${{ runner.temp }}/maven-repository-a
          format: json
          output: .trino-security-feasibility/trivy-vulnerability.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          vuln-type: library
          list-all-pkgs: true
          exit-code: 0

      - name: Require High zero and Critical zero
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_trino_maven_security_feasibility.py \
            verify-scan \
            --repository "${RUNNER_TEMP}/maven-repository-a" \
            --report .trino-security-feasibility/trivy-vulnerability.json
